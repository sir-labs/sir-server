services:
  sir-watcher:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sir-watcher
    ports:
      - "127.0.0.1:8080:8080"   # dashboard is served via proxy.sir-labs.com (gated); host port is local-only
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - nginx-conf:/etc/nginx/conf.d
      - ${HOME}/.config/sir-server/monitor:/run/sir-monitor:ro
    environment:
      DOMAIN: ${DOMAIN:-sir-labs.com}
      NGINX_CONTAINER: sir-nginx
      PROXY_NETWORK: sir-server_sir-net
      CONF_DIR: /etc/nginx/conf.d
      DASHBOARD_PORT: "8080"
      AUTH_ENABLED: ${AUTH_ENABLED:-true}          # "false" = kill switch, every route public
      AUTH_HOST: auth.${DOMAIN:-sir-labs.com}      # never gated
      AUTH_UPSTREAM: http://sir-auth:8080
    labels:
      proxy.enable: "true"
      proxy.host: proxy.${DOMAIN:-sir-labs.com}
      proxy.port: "8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # same target sir-nginx uses — lets the watcher verify it's reachable before writing internal.conf
    networks:
      - sir-net
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    depends_on:
      sir-nginx:
        condition: service_healthy

networks:
  sir-net:

volumes:
  nginx-conf:
