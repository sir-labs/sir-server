name: sir-monitor

services:
  monitor:
    image: netdata/netdata:stable
    hostname: sir-server
    pid: host
    restart: unless-stopped
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    environment:
      DO_NOT_TRACK: "1"
    volumes:
      - config:/etc/netdata
      - lib:/var/lib/netdata
      - cache:/var/cache/netdata
      - /:/host/root:ro,rslave
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /etc/localtime:/etc/localtime:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/log:/host/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/dbus:/run/dbus:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:19999/api/v1/info"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  config:
  lib:
  cache:
