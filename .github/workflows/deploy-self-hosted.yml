name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sir-server-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, sir-labs]
    steps:
      # No submodules: compose.yaml only includes gateway/*, and one of the
      # submodules is a private GitLab repo the runner can't clone. Deploy
      # the services in services.yaml from their own repos instead.
      - uses: actions/checkout@v7
      - name: Verify Docker access
        run: docker info >/dev/null
      - name: Validate
        run: docker compose config --quiet
      # Fetch and build everything up front: `up` then only has to swap
      # containers, which keeps the gateway (and every *.sir-labs.com route
      # through it) down for seconds instead of minutes.
      - name: Pull and build images
        run: |
          docker compose pull --ignore-buildable --quiet
          docker compose build
      # Recreating the gateway drops the runner's own long-poll to GitHub
      # (SocketException 125), so the NEXT queued job waits out a reconnect
      # backoff. The job doing the deploying still finishes fine.
      - name: Deploy
        run: docker compose up -d --remove-orphans --wait
      - name: Prune unused images
        if: always()
        run: docker image prune -f
